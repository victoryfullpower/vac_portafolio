<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío a Impresora (WebSocket)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        #status { margin-top: 20px; padding: 10px; display: none; }
        .success { background-color: #dff0d8; display: block; }
        .error { background-color: #f2dede; display: block; }
    </style>
</head>
<body>
    <h1>Envío de Comanda vía WebSocket</h1>
    
    <div class="form-group">
        <input type="text" id="orderNumber" placeholder="Número de pedido">
    </div>
    
    <div class="form-group">
        <input type="text" id="customer" placeholder="Cliente">
    </div>
    
    <div class="form-group">
        <input type="text" id="item" placeholder="Artículo">
        <input type="number" id="price" placeholder="Precio" step="0.01">
        <input type="number" id="quantity" placeholder="Cantidad" value="1">
    </div>
    
    <button id="sendBtn">Enviar a Impresora</button>
    
    <div id="status"></div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const orderData = {
                orderNumber: document.getElementById('orderNumber').value,
                customer: document.getElementById('customer').value,
                items: [{
                    description: document.getElementById('item').value,
                    price: parseFloat(document.getElementById('price').value),
                    quantity: parseInt(document.getElementById('quantity').value)
                }]
            };

            try {
                const response = await fetch('http://192.168.18.175:3001/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showMessage(`Pedido ${result.orderId} enviado a impresoras`, 'success');
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        });

        function showMessage(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = type;
            setTimeout(() => status.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
